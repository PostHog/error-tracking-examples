org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# posthog-android pulls in androidx.lifecycle.
android.useAndroidX=true
kotlin.code.style=official

# posthog-cli credentials, synced from the repo-root .env by bin/copy-env and
# handed to the CLI by the gradle plugin as POSTHOG_CLI_DOTENV_FILE.
posthog.dotenvFile=.env

# The release mode is left at its default (symbol-set) here: the mapping upload
# stamps the release it creates onto the mapping, and exceptions inherit the
# release from the mapping their frames resolved against. See ../android-releaseless
# for the other half of the comparison.
