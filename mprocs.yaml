# mprocs config for the error-tracking examples.
#
#   mprocs --config mprocs.yaml
#
# All procs are off by default — start each one manually from the mprocs UI.
# Each example has two procs: the normal release-binding flow, and the experimental
# --release-mode=event flow (releaseless).
# (ios-raw is a Swift app with no package.json, so it has no proc here.)

procs:
  node-raw:
    shell: 'pnpm install && pnpm start'
    cwd: node-raw
    autostart: false

  node-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-raw
    autostart: false

  node-rollup:
    shell: 'pnpm install && pnpm start'
    cwd: node-rollup
    autostart: false

  node-rollup (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-rollup
    autostart: false

  web-raw:
    shell: 'pnpm install && pnpm start'
    cwd: web-raw
    autostart: false

  web-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: web-raw
    autostart: false
