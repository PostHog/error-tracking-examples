# mprocs (phrocs) config for the error-tracking examples.
#
#   mprocs --config mprocs.yaml
#
# env-setup runs on every launch (bin/copy-env): it validates the credentials in the root .env
# against the local PostHog, repairs them where it can, and copies the root .env into every
# example. Edit env vars in the root .env only — the per-example copies are overwritten.
#
# Every other proc is off by default; start one from the sidebar. Procs are grouped by how the
# release reaches an exception:
#
#   Legacy       the upload binds the symbol set to a release
#   Releaseless  --release-mode=event: symbol sets are release-independent and the release id is
#                injected into the build output, which the SDK reports as $release_id
#   Release env  the release id is resolved before launch and handed to the SDK in
#                POSTHOG_RELEASE_ID
#
# Bug reproductions sit under Legacy. What each example needs (toolchains, local SDK checkouts) is
# in README.md and the example's own README; conventions for adding one are in AGENTS.md.
# (ios-raw is an Xcode project run from Xcode, so it has no proc here.)

procs:
  # Named to sort alphabetically before every example: phrocs selects the
  # first proc in its (alphabetical) process list on startup, so this is the
  # pane that opens by default.
  env-setup:
    shell: './bin/copy-env'
    autostart: true
    ready_pattern: 'Env sync complete'
    groups:
      layer: Setup

  android-legacy:
    shell: './run'
    cwd: android-legacy
    autostart: false
    groups:
      layer: Legacy

  android-releaseless:
    shell: './run'
    cwd: android-releaseless
    autostart: false
    groups:
      layer: Releaseless

  # Release build of a Flutter web app, then the sourcemap upload, then a static
  # server on 7801/7802. The app throws one uncaught exception two seconds after
  # the page loads, so a run needs nobody to click anything. `APP_VERSION=2.0.0
  # ./run` in either directory ships the same code again as a second release,
  # which is the case the two exist to contrast.
  flutter-web-legacy:
    shell: './run'
    cwd: flutter-web-legacy
    autostart: false
    groups:
      layer: Legacy

  flutter-web-releaseless:
    shell: './run'
    cwd: flutter-web-releaseless
    autostart: false
    groups:
      layer: Releaseless

  node-raw:
    shell: 'pnpm install && pnpm start'
    cwd: node-raw
    autostart: false
    groups:
      layer: Legacy

  node-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-raw
    autostart: false
    groups:
      layer: Releaseless

  node-legacy-sdk:
    shell: 'pnpm install && pnpm start'
    cwd: node-legacy-sdk
    autostart: false
    groups:
      layer: Releaseless

  node-rollup:
    shell: 'pnpm install && pnpm start'
    cwd: node-rollup
    autostart: false
    groups:
      layer: Legacy

  node-rollup (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-rollup
    autostart: false
    groups:
      layer: Releaseless

  next-webpack:
    shell: 'pnpm install && pnpm start'
    cwd: next-webpack
    autostart: false
    groups:
      layer: Legacy

  next-webpack (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: next-webpack
    autostart: false
    groups:
      layer: Releaseless

  nuxt-spa:
    shell: 'pnpm install && pnpm start'
    cwd: nuxt-spa
    autostart: false
    groups:
      layer: Legacy

  nuxt-spa (keep maps):
    shell: 'pnpm install && pnpm start:keep'
    cwd: nuxt-spa
    autostart: false
    groups:
      layer: Legacy

  nuxt-spa (pr4779):
    shell: 'pnpm install && pnpm start:fixed'
    cwd: nuxt-spa
    autostart: false
    groups:
      layer: Legacy

  nuxt-spa (pr4779, keep maps):
    shell: 'pnpm install && pnpm start:fixed:keep'
    cwd: nuxt-spa
    autostart: false
    groups:
      layer: Legacy

  node-webpack:
    shell: 'pnpm install && pnpm start'
    cwd: node-webpack
    autostart: false
    groups:
      layer: Legacy

  node-webpack (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-webpack
    autostart: false
    groups:
      layer: Releaseless

  # Release build on the iOS simulator, end to end: metro, hermesc, compose-source-maps,
  # posthog-cli hermes clone and upload, then install and launch. The app captures one
  # exception a few seconds after launch, so a run needs nobody to tap the screen. The two
  # variants use different bundle identifiers and can sit on the simulator together.
  expo (ios):
    shell: 'pnpm install && pnpm ios'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Legacy

  expo-releaseless (ios):
    shell: 'pnpm install && pnpm ios:releaseless'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Releaseless

  # The EAS-update shaped flow: expo export plus a manual hermes upload, no Xcode. Much faster
  # than the full build, and the only one of the two that covers uploading outside a native build.
  expo (export only):
    shell: 'pnpm install && pnpm sourcemaps'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Legacy

  expo-releaseless (export only):
    shell: 'pnpm install && pnpm sourcemaps:releaseless'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Releaseless

  # Release build, native debug symbol upload, then the binary runs and captures one exception.
  # rust-raw: published posthog-rs and posthog-cli, the symbol set bound to the release.
  # rust-releaseless: the working copies of both, `--release-mode=event`, the CLI injecting the
  # release id into the binary for the SDK to report as `$release_id`. `APP_VERSION=2.0.0 ./run` in
  # either directory ships the same binary again as a second release, which is the case the two
  # exist to contrast.
  rust-raw:
    shell: './run'
    cwd: rust-raw
    autostart: false
    groups:
      layer: Legacy

  rust-releaseless:
    shell: './run'
    cwd: rust-releaseless
    autostart: false
    groups:
      layer: Releaseless

  # The release id comes from the environment instead of the build: `./run` resolves the release
  # with `posthog-cli release resolve` and launches the app with its id in POSTHOG_RELEASE_ID, which
  # the SDK reports as $release_id. Each builds against the working copy of its SDK, a sibling
  # checkout, because reading POSTHOG_RELEASE_ID has not shipped. `APP_VERSION=2.0.0 ./run` ships
  # the same code again as a second release.
  rust-release-env:
    shell: './run'
    cwd: rust-release-env
    autostart: false
    groups:
      layer: Release env

  python-release-env:
    shell: './run'
    cwd: python-release-env
    autostart: false
    groups:
      layer: Release env

  ruby-release-env:
    shell: './run'
    cwd: ruby-release-env
    autostart: false
    groups:
      layer: Release env

  php-release-env:
    shell: './run'
    cwd: php-release-env
    autostart: false
    groups:
      layer: Release env

  web-raw:
    shell: 'pnpm install && pnpm start'
    cwd: web-raw
    autostart: false
    groups:
      layer: Legacy

  web-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: web-raw
    autostart: false
    groups:
      layer: Releaseless

  web-vite-sri3:
    shell: 'pnpm install && pnpm start'
    cwd: web-vite-sri3
    autostart: false
    groups:
      layer: Legacy

  web-angular-sw:
    shell: 'pnpm install && pnpm start'
    cwd: web-angular-sw
    autostart: false
    groups:
      layer: Legacy

  web-webpack-sml:
    shell: 'pnpm install && pnpm build; pnpm build:before'
    cwd: web-webpack-sml
    autostart: false
    groups:
      layer: Legacy

# Grouping dimension the sidebar starts grouped by (press `g` to cycle/disable).
default_group: layer

group_order:
  layer: [Setup, Legacy, Releaseless, Release env]
