# mprocs (phrocs) config for the error-tracking examples.
#
#   mprocs --config mprocs.yaml
#
# env-setup runs automatically on every launch: it bootstraps the root .env
# (for project 1) if it is missing, validates the credentials
# in the root .env against the local PostHog instance (minting a fresh
# error_tracking-scoped personal API key if the stored one is dead, and
# re-syncing POSTHOG_KEY with the project's token), then copies the root .env
# into each child project (bin/copy-env). Edit env vars in the root .env only —
# the per-project copies are overwritten on startup.
#
# All example procs are off by default — start each one manually from the
# mprocs UI. Most examples appear twice, one proc per sidebar group: the normal
# release-binding flow (Legacy) and the experimental --release-mode=event flow
# (Releaseless). The android ones are two separate projects instead of two procs
# over one, so each gets its own applicationId, release and mapping. web-vite-sri3 differs: it reproduces the
# @posthog/rollup-plugin x vite-plugin-sri3 incompatibility, so its single
# (Legacy) proc fails the SRI check every time by design.
# (ios-raw is a Swift app with no package.json, so it has no proc here.) The rust ones are
# two separate projects as well, rust-raw and rust-releaseless: they build against different
# posthog-rs versions (the published crate vs the working copy that carries the release marker),
# and each gets its own release.
#
# The android-* procs build against a local working copy of posthog-android,
# published to ~/.m2 on the way, because `posthog.releaseMode` is unreleased;
# the mapping upload uses the published posthog-cli off PATH. Each one boots the
# emulator if none is attached, installs its APK and streams its logs; tap
# "Capture exception" in the app to send one. Set POSTHOG_SKIP_DEPS=1 to skip
# the republish once it is current.
#
# The expo procs run a locally built posthog-cli, because `hermes clone --release-mode`
# has not shipped either. The export-only procs reach it through bin/posthog-cli-local;
# the full iOS builds go through bin/install-posthog-cli-local instead, which symlinks
# ~/.posthog/posthog-cli at the build, since that is where an Xcode build phase looks
# first. Both build the CLI on the way, so the first run is slow.
#
# rust-releaseless runs the locally built posthog-cli too (`symbol-sets upload --release-mode`
# is unreleased), through bin/posthog-cli-local, and builds against the working copy of
# posthog-rs, because the release marker — the placeholder the CLI overwrites with the release
# id, which the SDK then reports as `$release_id` — has not shipped either.

procs:
  # Named to sort alphabetically before every example: phrocs selects the
  # first proc in its (alphabetical) process list on startup, so this is the
  # pane that opens by default.
  env-setup:
    shell: './bin/copy-env'
    autostart: true
    ready_pattern: 'Env sync complete'
    groups:
      layer: Setup

  android-legacy:
    shell: './run'
    cwd: android-legacy
    autostart: false
    groups:
      layer: Legacy

  android-releaseless:
    shell: './run'
    cwd: android-releaseless
    autostart: false
    groups:
      layer: Releaseless

  node-raw:
    shell: 'pnpm install && pnpm start'
    cwd: node-raw
    autostart: false
    groups:
      layer: Legacy

  node-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-raw
    autostart: false
    groups:
      layer: Releaseless

  node-rollup:
    shell: 'pnpm install && pnpm start'
    cwd: node-rollup
    autostart: false
    groups:
      layer: Legacy

  node-rollup (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-rollup
    autostart: false
    groups:
      layer: Releaseless

  next-webpack:
    shell: 'pnpm install && pnpm start'
    cwd: next-webpack
    autostart: false
    groups:
      layer: Legacy

  next-webpack (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: next-webpack
    autostart: false
    groups:
      layer: Releaseless

  node-webpack:
    shell: 'pnpm install && pnpm start'
    cwd: node-webpack
    autostart: false
    groups:
      layer: Legacy

  node-webpack (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: node-webpack
    autostart: false
    groups:
      layer: Releaseless

  # Release build on the iOS simulator, end to end: metro, hermesc, compose-source-maps,
  # posthog-cli hermes clone and upload, then install and launch. The app captures one
  # exception a few seconds after launch, so a run needs nobody to tap the screen. The two
  # variants use different bundle identifiers and can sit on the simulator together.
  expo (ios):
    shell: 'pnpm install && pnpm ios'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Legacy

  expo-releaseless (ios):
    shell: 'pnpm install && pnpm ios:releaseless'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Releaseless

  # The EAS-update shaped flow: expo export plus a manual hermes upload, no Xcode. Much faster
  # than the full build, and the only one of the two that covers uploading outside a native build.
  expo (export only):
    shell: 'pnpm install && pnpm sourcemaps'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Legacy

  expo-releaseless (export only):
    shell: 'pnpm install && pnpm sourcemaps:releaseless'
    cwd: react-native-expo
    autostart: false
    groups:
      layer: Releaseless

  # Release build, native debug symbol upload, then the binary runs and captures one exception.
  # rust-raw: published posthog-rs and posthog-cli, the symbol set bound to the release.
  # rust-releaseless: the working copies of both, `--release-mode=event`, the CLI injecting the
  # release id into the binary for the SDK to report as `$release_id`. `APP_VERSION=2.0.0 ./run` in
  # either directory ships the same binary again as a second release, which is the case the two
  # exist to contrast.
  rust-raw:
    shell: './run'
    cwd: rust-raw
    autostart: false
    groups:
      layer: Legacy

  rust-releaseless:
    shell: './run'
    cwd: rust-releaseless
    autostart: false
    groups:
      layer: Releaseless

  web-raw:
    shell: 'pnpm install && pnpm start'
    cwd: web-raw
    autostart: false
    groups:
      layer: Legacy

  web-raw (releaseless):
    shell: 'pnpm install && pnpm start:releaseless'
    cwd: web-raw
    autostart: false
    groups:
      layer: Releaseless

  web-vite-sri3:
    shell: 'pnpm install && pnpm start'
    cwd: web-vite-sri3
    autostart: false
    groups:
      layer: Legacy

# Grouping dimension the sidebar starts grouped by (press `g` to cycle/disable).
default_group: layer

group_order:
  layer: [Setup, Legacy, Releaseless]
