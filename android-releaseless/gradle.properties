org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# posthog-android pulls in androidx.lifecycle.
android.useAndroidX=true
kotlin.code.style=official

# posthog-cli credentials, synced from the repo-root .env by bin/copy-env and
# handed to the CLI by the gradle plugin as POSTHOG_CLI_DOTENV_FILE.
posthog.dotenvFile=.env

# The whole point of this example. posthog-cli uploads the mapping without
# binding it to a release, and each event resolves its own release from the
# $app_namespace / $app_version / $app_build the SDK already sends. Nothing is
# injected into the app, and two releases that ship the same mapping no longer
# both report whichever release uploaded it first. See ../android-legacy for the
# other half of the comparison.
posthog.releaseMode=event
